<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Previews</title>
<style>
  :root{
    --bg:#0f1115; --card:#161922; --line:rgba(255,255,255,.12);
    --fg:#f2f4f8; --muted:#9aa3b2; --accent:#c9a227;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:clamp(20px,5vw,48px);
  }
  header{max-width:1080px;margin:0 auto clamp(20px,4vw,36px)}
  h1{margin:0;font-size:clamp(20px,3.5vw,27px);letter-spacing:-.01em}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  .grid{
    max-width:1080px;margin:0 auto;display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  }
  a.card{
    display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    transition:border-color .15s, transform .15s;
  }
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .thumb{
    aspect-ratio:4/3;background:#11141b;display:flex;align-items:center;
    justify-content:center;color:#3a4150;font-size:12px;letter-spacing:.08em;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{padding:13px 15px}
  .meta b{display:block;font-size:14.5px;font-weight:600}
  .meta span{display:block;margin-top:2px;color:var(--muted);font-size:12.5px}
  footer{max-width:1080px;margin:36px auto 0;color:#5c6472;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>3D Previews</h1>
  <p>Open any model to orbit it, switch lighting, or place it in your room with AR.</p>
</header>

<div class="grid" id="grid"></div>

<footer>Best viewed on a phone for AR &middot; iOS Safari or Android Chrome</footer>

<script>
/* Add or rename entries here. `slug` must match the folder name. */
const MODELS = [
  { slug:"model-01", title:"Model 01", note:"" },
  { slug:"model-02", title:"Model 02", note:"" },
  { slug:"model-03", title:"Model 03", note:"" },
  { slug:"model-04", title:"Model 04", note:"" },
  { slug:"model-05", title:"Model 05", note:"" },
  { slug:"model-06", title:"Model 06", note:"" },
];

const grid = document.getElementById('grid');
for (const m of MODELS) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = m.slug + '/';
  a.innerHTML =
    '<div class="thumb"><img alt="" loading="lazy" src="' + m.slug + '/poster.webp"></div>' +
    '<div class="meta"><b></b><span></span></div>';
  a.querySelector('b').textContent = m.title;
  a.querySelector('span').textContent = m.note || 'View in 3D & AR';
  // graceful fallback when no poster.webp exists yet
  const img = a.querySelector('img');
  img.onerror = () => { img.remove(); a.querySelector('.thumb').textContent = 'NO PREVIEW'; };
  grid.appendChild(a);
}
</script>
</body>
</html>
