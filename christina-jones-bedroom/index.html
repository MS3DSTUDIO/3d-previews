<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christina Jones · Bedroom 360°</title>
<meta name="description" content="Interactive 360° bedroom presentation - Christina Jones · Maureen Stevens Design">
<meta property="og:type" content="website">
<meta property="og:title" content="Christina Jones · Bedroom 360°">
<meta property="og:description" content="Look around the bedroom in 360° and browse the photographs.">
<meta property="og:image" content="https://ms3dstudio.github.io/3d-previews/christina-jones-bedroom/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
<style>
  :root{
    --green:#1c4a35; --green-d:#123324; --green-90:rgba(22,58,42,.86); --gold:#b8a15e; --gold-soft:#d9c891;
    --cream:#f4efe6; --ink:#10261c; --line:rgba(217,200,145,.35);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--green-d);overflow:hidden;font-family:Jost,system-ui,sans-serif;color:var(--cream)}
  button{font-family:inherit}
  #pano{position:fixed;inset:0;transition:filter 1.6s var(--ease), transform 2.4s var(--ease)}
  body.intro #pano{filter:blur(10px) brightness(.55) saturate(.9);transform:scale(1.06)}

  /* ---------- intro ---------- */
  .intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:24px;
         background:radial-gradient(120% 90% at 50% 40%, rgba(28,74,53,.55), rgba(10,28,20,.92));
         transition:opacity 1.1s var(--ease), visibility 1.1s}
  body:not(.intro) .intro{opacity:0;visibility:hidden;pointer-events:none}
  .intro-inner{display:flex;flex-direction:column;align-items:center}
  .intro .mark{width:clamp(110px,15vw,170px);opacity:0;transform:translateY(18px) scale(.94);
               filter:drop-shadow(0 14px 34px rgba(0,0,0,.5));animation:rise 1.4s .25s var(--ease) forwards}
  .intro .rule{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--gold),transparent);
               margin:26px 0 22px;animation:draw 1.4s 1.1s var(--ease) forwards}
  .intro h1{margin:0;font:600 clamp(34px,5.4vw,64px)/1.02 "Cormorant Garamond",serif;letter-spacing:.01em;
            opacity:0;transform:translateY(18px);animation:rise 1.3s 1.3s var(--ease) forwards}
  .intro h1 em{font-style:italic;font-weight:500;color:var(--gold-soft)}
  .intro p{margin:14px 0 0;font:300 clamp(11px,1.1vw,13px)/1.6 Jost;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-soft);
           opacity:0;transform:translateY(18px);animation:rise 1.2s 1.6s var(--ease) forwards}
  .enter{margin-top:38px;position:relative;overflow:hidden;font:500 13px/1 Jost;letter-spacing:.28em;text-transform:uppercase;
         color:var(--ink);background:var(--gold);border:0;border-radius:999px;padding:17px 34px 17px 38px;cursor:pointer;
         opacity:0;transform:translateY(18px);animation:rise 1.2s 2s var(--ease) forwards;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:filter .3s}
  .enter:hover{filter:brightness(1.08)}
  .enter::after{content:"";position:absolute;inset:0;transform:translateX(-120%) skewX(-20deg);
                background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s 3.2s infinite}
  .enter[disabled]{filter:saturate(.4) brightness(.85);cursor:progress}
  .loadnote{margin-top:14px;font:300 11px/1.5 Jost;letter-spacing:.2em;color:rgba(244,239,230,.6);text-transform:uppercase;min-height:11px}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes draw{to{width:min(320px,60vw)}}
  @keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}35%,100%{transform:translateX(220%) skewX(-20deg)}}

  /* ---------- chrome (slides in after intro) ---------- */
  .ui{transition:opacity .9s var(--ease), transform .9s var(--ease)}
  body.intro .ui{opacity:0;pointer-events:none}
  body.intro .title,body.intro .topbtns{transform:translateY(-14px)}
  body.intro .panel,body.intro .logo{transform:translateY(24px)}

  .title{position:fixed;top:18px;left:20px;z-index:5;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.5)}
  .title h2{margin:0;font:600 26px/1.1 "Cormorant Garamond",serif;letter-spacing:.02em}
  .title p{margin:4px 0 0;font:400 11px/1 Jost;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-soft)}
  .loc-name{position:fixed;left:50%;top:46%;z-index:6;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;
            font:500 clamp(30px,4.6vw,56px)/1 "Cormorant Garamond",serif;font-style:italic;letter-spacing:.02em;
            text-shadow:0 4px 30px rgba(0,0,0,.6);opacity:0}
  .loc-name.show{animation:locname 2.6s var(--ease)}
  @keyframes locname{0%{opacity:0;letter-spacing:.22em}25%{opacity:1;letter-spacing:.04em}70%{opacity:1}100%{opacity:0}}

  .topbtns{position:fixed;top:16px;right:20px;z-index:6;display:flex;gap:8px}
  .chip{display:flex;align-items:center;gap:8px;font:500 11px/1 Jost;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);
        background:var(--green-90);border:1px solid var(--line);border-radius:999px;padding:10px 14px;cursor:pointer;
        backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .25s}
  .chip:hover{border-color:var(--gold)}
  .chip svg{width:15px;height:15px;fill:none;stroke:var(--gold-soft);stroke-width:1.6}

  .panel{position:fixed;left:20px;bottom:20px;z-index:5;display:flex;flex-direction:column;gap:10px;
         background:var(--green-90);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
         backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:min(580px,calc(100vw - 170px))}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lbl{font:500 10px/1 Jost;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-soft);min-width:84px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{font:400 13px/1 Jost;color:var(--cream);background:transparent;border:1px solid var(--line);
              border-radius:999px;padding:8px 13px;cursor:pointer;transition:background .25s,border-color .25s,color .25s,transform .25s;white-space:nowrap}
  .seg button:hover{border-color:var(--gold);transform:translateY(-1px)}
  .seg button.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .seg button:focus-visible,.chip:focus-visible,.logo:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}

  .logo{position:fixed;right:20px;bottom:20px;z-index:5;width:104px;display:block;cursor:pointer;outline:none;
        filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .logo img{width:100%;height:auto;display:block;transition:transform .4s var(--ease)}
  .logo:hover img{transform:translateY(-3px) scale(1.03)}

  /* ---------- hotspots ---------- */
  .hs-link{width:46px;height:46px;border-radius:50%;background:rgba(244,239,230,.94);border:2px solid var(--gold);
           box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;display:grid;place-items:center;transition:transform .25s var(--ease)}
  .hs-link:hover{transform:scale(1.12)}
  .hs-link svg{width:20px;height:20px;fill:var(--green)}
  .hs-app{width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid rgba(244,239,230,.95);cursor:pointer;animation:pulse 2.2s infinite}
  .hs-cam{width:34px;height:34px;border-radius:50%;background:var(--green);border:2px solid var(--gold-soft);cursor:pointer;
          display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .25s var(--ease)}
  .hs-cam:hover{transform:scale(1.12)}
  .hs-cam svg{width:16px;height:16px;fill:none;stroke:var(--gold-soft);stroke-width:1.7}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,161,94,.75)}70%{box-shadow:0 0 0 15px rgba(184,161,94,0)}100%{box-shadow:0 0 0 0 rgba(184,161,94,0)}}
  .tipx{visibility:hidden;opacity:0;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translate(-50%,4px);
        background:var(--green);color:var(--cream);font:400 12px/1 Jost;padding:7px 10px;border-radius:6px;white-space:nowrap;border:1px solid var(--line);
        transition:opacity .2s,transform .2s}
  .hs-link:hover .tipx,.hs-app:hover .tipx,.hs-cam:hover .tipx{visibility:visible;opacity:1;transform:translate(-50%,0)}
  .pnlm-load-box{background:var(--green-90)!important;border:1px solid var(--line);border-radius:12px!important}
  .pnlm-lbar-fill{background:var(--gold)!important}
  .pnlm-controls-container{display:none}
  .hint{position:fixed;top:72px;left:20px;z-index:5;font:400 12px/1.4 Jost;color:rgba(244,239,230,.88);text-shadow:0 1px 6px rgba(0,0,0,.6);transition:opacity 1s}

  /* ---------- gallery ---------- */
  .gal{position:fixed;inset:0;z-index:30;background:rgba(9,22,16,.96);display:flex;flex-direction:column;
       opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s}
  .gal.open{opacity:1;visibility:visible}
  .gal-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
  .gal-top h3{margin:0;font:600 22px/1 "Cormorant Garamond",serif}
  .gal-top span{font:400 11px/1 Jost;letter-spacing:.22em;color:var(--gold-soft);text-transform:uppercase;margin-left:12px}
  .gal-stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;padding:0 70px;min-height:0}
  .gal-stage figure{margin:0;display:flex;flex-direction:column;align-items:center}
  .gal-stage .frame{overflow:hidden;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.55);background:#0b1a13}
  .gal-stage img{display:block;max-width:calc(100vw - 140px);max-height:calc(100vh - 230px);object-fit:contain;
                 opacity:0;transform:scale(1.05);transition:opacity .7s var(--ease), transform 8s linear}
  .gal-stage img.in{opacity:1;transform:scale(1)}
  .gal-stage figcaption{margin-top:14px;text-align:center;font:500 italic 22px/1 "Cormorant Garamond",serif;letter-spacing:.02em}
  .gal-stage figcaption small{display:block;margin-top:6px;font:400 10px/1 Jost;letter-spacing:.26em;color:var(--gold-soft);text-transform:uppercase;font-style:normal}
  .gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
           background:var(--green-90);cursor:pointer;display:grid;place-items:center;transition:border-color .25s}
  .gal-nav:hover{border-color:var(--gold)}
  .gal-nav svg{width:18px;height:18px;fill:none;stroke:var(--gold-soft);stroke-width:2}
  .gal-prev{left:14px}.gal-next{right:14px}
  .gal-thumbs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 18px;scrollbar-width:thin}
  .gal-thumbs button{flex:0 0 auto;width:108px;height:72px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;
                     opacity:.55;transition:opacity .25s,border-color .25s;background:#000}
  .gal-thumbs button.on,.gal-thumbs button:hover{opacity:1;border-color:var(--gold)}
  .gal-thumbs img{width:100%;height:100%;object-fit:cover;display:block}

  @media (max-width:700px){
    .title h2{font-size:20px}.title p{font-size:9px}
    .panel{left:10px;bottom:10px;padding:10px 12px;gap:8px;max-width:calc(100vw - 104px)}
    .lbl{min-width:0;width:100%;font-size:9px}
    .seg button{font-size:12px;padding:7px 10px}
    .logo{right:10px;bottom:10px;width:76px}
    .topbtns{right:10px;top:12px}.chip{padding:9px 11px}.chip b{display:none}
    .hint{top:58px;right:10px}
    .gal-stage{padding:0 8px}.gal-stage img{max-width:calc(100vw - 16px);max-height:calc(100vh - 220px)}
    .gal-nav{display:none}.gal-thumbs button{width:84px;height:56px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body class="intro">
<div id="pano"></div>

<!-- intro -->
<section class="intro" id="intro" aria-label="Welcome">
  <div class="intro-inner">
    <img class="mark" src="logo.webp" alt="Maureen Stevens Design">
    <div class="rule"></div>
    <h1>Christina Jones<br><em>The Bedroom</em></h1>
    <p>An interactive 360° presentation</p>
    <button class="enter" id="enter" type="button" disabled>Enter</button>
    <div class="loadnote" id="loadnote">Preparing the tour…</div>
  </div>
</section>

<div class="title ui"><h2>Christina Jones</h2><p>Bedroom · 360° tour</p></div>
<div class="hint ui" id="hint">Drag to look around · camera icons show photos · use View below to face each wall</div>
<div class="loc-name" id="locname"></div>

<div class="topbtns ui">
  <button class="chip" id="btnGallery" type="button" aria-label="Photo gallery">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><b>Photos</b></button>
  <button class="chip" id="btnFull" type="button" aria-label="Full screen">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<nav class="panel ui" aria-label="Tour controls">
  <div class="row"><span class="lbl">Location</span><div class="seg" id="segNode"></div></div>
  <div class="row"><span class="lbl">View</span><div class="seg" id="segView"></div></div>
  <div class="row"><span class="lbl">Floor</span><div class="seg" id="segFloor"></div></div>
  <div class="row"><span class="lbl">Appliances</span><div class="seg" id="segDoors"></div></div>
  <div class="row" id="rowTime"><span class="lbl">Lighting</span><div class="seg" id="segTime"></div></div>
</nav>

<a class="logo ui" id="logo" href="https://www.maureenstevens.com/" target="_blank" rel="noopener" aria-label="Maureen Stevens Design website">
  <img src="logo.webp" alt="Maureen Stevens Design"></a>

<!-- gallery -->
<section class="gal" id="gal" aria-label="Photo gallery" aria-hidden="true">
  <div class="gal-top">
    <div style="display:flex;align-items:baseline"><h3>Photographs</h3><span id="galCount"></span></div>
    <button class="chip" id="galClose" type="button" aria-label="Close gallery">Close ✕</button>
  </div>
  <div class="gal-stage">
    <button class="gal-nav gal-prev" id="galPrev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <figure><div class="frame"><img id="galImg" alt=""></div><figcaption id="galCap"></figcaption></figure>
    <button class="gal-nav gal-next" id="galNext" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="gal-thumbs" id="galThumbs"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script src="tour.js"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);
  if (location.protocol === 'file:') {
    $('loadnote').textContent = 'Open the web link - browsers block 360° images opened from disk';
    return;
  }
  const T = window.TOUR || await (await fetch('tour.json', {cache:'no-cache'})).json();

  let maxTex = 4096;
  try { const gl=document.createElement('canvas').getContext('webgl'); if(gl) maxTex=gl.getParameter(gl.MAX_TEXTURE_SIZE); } catch(e){}
  const useMobile = maxTex < 6000 || Math.min(screen.width, screen.height) < 820;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Pannellum's hfov is horizontal, so on a portrait phone the same value stretches the room vertically.
  const portrait = () => innerHeight > innerWidth;
  const fitH = h => portrait() ? Math.min(h, 64) : h;
  const MAXH = portrait() ? 100 : 118;

  if (T.client && T.client.url) $('logo').href = T.client.url;

  const S = {node:T.default_node, floor:T.default_floor, doors:T.default_doors, time:'day', view:null};
  const TIMES = T.times || ['day'];
  const nodeById = Object.fromEntries(T.nodes.map(n=>[n.id,n]));
  const stills = T.stills || [];
  const stillIdx = Object.fromEntries(stills.map((s,i)=>[s.id,i]));
  const sid = (n,f,d,t)=>`${n}|${f}|${d}|${t}`;
  const url = (n,f,d,t)=>{let p=nodeById[n].panos[`floor-${f}__doors-${d}`]; if(p && t==='night') p=p.night; return p ? (useMobile ? p.mobile : p.full) : null;};

  const ICON_ARROW = '<svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>';
  const ICON_CAM   = '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.4"/></svg>';
  function tip(div, a){ div.classList.add(a.cls); div.innerHTML = (a.icon||'') + `<span class="tipx">${a.label}</span>`; }

  const scenes = {};
  for (const n of T.nodes) for (const f of Object.keys(T.floors)) for (const d of Object.keys(T.doors)) for (const t of TIMES){
    const u = url(n.id,f,d,t); if(!u) continue;
    const hs = [];
    for (const l of n.links) hs.push({pitch:l.pitch, yaw:l.yaw, type:'custom', createTooltipFunc:tip,
        createTooltipArgs:{cls:'hs-link', icon:ICON_ARROW, label:l.label}, clickHandlerFunc:()=>goNode(l.to)});
    for (const a of n.appliances) hs.push({pitch:a.pitch, yaw:a.yaw, type:'custom', createTooltipFunc:tip,
        createTooltipArgs:{cls:'hs-app', label:(d==='closed'?'Open ':'Close ')+a.label},
        clickHandlerFunc:()=>setDoors(S.doors==='closed'?'all_open':'closed')});
    for (const p of (n.photos||[])) if (p.still in stillIdx) hs.push({pitch:p.pitch, yaw:p.yaw, type:'custom', createTooltipFunc:tip,
        createTooltipArgs:{cls:'hs-cam', icon:ICON_CAM, label:'Photo · '+stills[stillIdx[p.still]].caption},
        clickHandlerFunc:()=>openGallery(stillIdx[p.still])});
    scenes[sid(n.id,f,d,t)] = {type:'equirectangular', panorama:u, hfov:fitH(n.view.hfov||100),
                             yaw:n.view.yaw||0, pitch:n.view.pitch||0, hotSpots:hs};
  }

  const viewer = pannellum.viewer('pano', {
    default:{firstScene:sid(S.node,S.floor,S.doors,S.time), sceneFadeDuration:800, autoLoad:true, showControls:false,
             compass:false, minHfov:45, maxHfov:MAXH, friction:0.15, autoRotate:reduce?0:-2.2, autoRotateInactivityDelay:-1},
    scenes
  });

  // ---------- intro ----------
  let ready=false;
  viewer.on('load', ()=>{
    if(!ready){ ready=true; $('enter').disabled=false; $('loadnote').textContent=''; }
    prefetch();
  });
  $('enter').onclick = ()=>{
    document.body.classList.remove('intro');
    viewer.stopAutoRotate();
    const n=nodeById[S.node];
    if(!reduce){ viewer.setHfov(MAXH,false); viewer.lookAt(n.view.pitch||0, n.view.yaw||0, fitH(n.view.hfov||100), 2600); }
    setTimeout(()=>showLoc(n.label), 900);
    setTimeout(()=>{const h=$('hint'); if(h) h.style.opacity=0;}, 9000);
  };

  function showLoc(label){ const el=$('locname'); el.textContent=label; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

  function load(n,f,d,t){
    const id=sid(n,f,d,t); if(!scenes[id]) return;
    const moving = n!==S.node;
    if(moving) S.view=null;
    S.node=n; S.floor=f; S.doors=d; S.time=t; paint();
    viewer.loadScene(id,'same','same','same');
    if(moving) setTimeout(()=>showLoc(nodeById[n].label), 500);
  }
  const goNode=n=>load(n,S.floor,S.doors,S.time), setFloor=f=>load(S.node,f,S.doors,S.time),
        setDoors=d=>load(S.node,S.floor,d,S.time), setTime=t=>load(S.node,S.floor,S.doors,t);

  function seg(el, items, cur, fn){
    el.innerHTML='';
    for (const [k,label] of items){
      const b=document.createElement('button'); b.type='button'; b.textContent=label;
      if(k===cur) b.classList.add('on'); b.setAttribute('aria-pressed', k===cur);
      b.onclick=()=>fn(k); el.appendChild(b);
    }
  }
  // rows with a single choice are hidden, so a one-room tour keeps the same panel without empty controls
  const rowShow = (id, on) => { $(id).parentElement.style.display = on ? '' : 'none'; };
  function setView(k){
    const v=(nodeById[S.node].views||[]).find(x=>x.id===k); if(!v) return;
    S.view=k; paint();
    viewer.lookAt(v.pitch||0, v.yaw||0, fitH(v.hfov||nodeById[S.node].view.hfov||100), reduce?false:1400);
  }
  function paint(){
    const narrow = innerWidth < 700;
    const fl = Object.entries(T.floors).map(([k,l])=>[k, narrow ? l.replace(/^(\w)\s*-\s*(\w+).*/, '$1 · $2') : l]);
    const views = nodeById[S.node].views || [];
    seg($('segNode'), T.nodes.map(n=>[n.id,n.label]), S.node, goNode);
    seg($('segView'), views.map(v=>[v.id, narrow && v.short ? v.short : v.label]), S.view, setView);
    seg($('segFloor'), fl, S.floor, setFloor);
    seg($('segDoors'), [['closed','Closed'],['all_open','Open']].filter(([k])=>k in T.doors), S.doors, setDoors);
    if (TIMES.length>1) seg($('segTime'), [['day','Day'],['night','Night']], S.time, setTime);
    rowShow('segNode', T.nodes.length>1);
    rowShow('segView', views.length>0);
    rowShow('segFloor', Object.keys(T.floors).length>1);
    rowShow('segDoors', Object.keys(T.doors).length>1);
    rowShow('segTime', TIMES.length>1);
  }
  paint(); addEventListener('resize', paint);
  const clearView = ()=>{ if(S.view!==null){ S.view=null; paint(); } };
  viewer.on('mousedown', clearView); viewer.on('touchstart', clearView);

  function prefetch(){
    setTimeout(()=>{ for (const f of Object.keys(T.floors)) for (const d of Object.keys(T.doors)){
      const u=url(S.node,f,d,S.time); if(u){ const i=new Image(); i.src=u; } }
      for (const t of TIMES){ const u=url(S.node,S.floor,S.doors,t); if(u){ const i=new Image(); i.src=u; } } }, 1500);
  }

  $('btnFull').onclick = ()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };

  // ---------- gallery ----------
  let gi=0;
  const gal=$('gal'), img=$('galImg'), thumbs=$('galThumbs');
  stills.forEach((s,i)=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-label',s.caption);
    b.innerHTML=`<img src="${s.thumb}" alt="" loading="lazy">`; b.onclick=()=>show(i); thumbs.appendChild(b); });
  if(!stills.length) $('btnGallery').style.display='none';
  function show(i){
    gi=(i+stills.length)%stills.length; const s=stills[gi];
    img.classList.remove('in');
    const pre=new Image();
    pre.onload=()=>{ img.src=s.src; img.alt=s.caption; requestAnimationFrame(()=>requestAnimationFrame(()=>img.classList.add('in'))); };
    pre.src=s.src;
    $('galCap').innerHTML=`${s.caption}<small>${String(gi+1).padStart(2,'0')} / ${String(stills.length).padStart(2,'0')}</small>`;
    [...thumbs.children].forEach((b,k)=>b.classList.toggle('on',k===gi));
    thumbs.children[gi]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    const nx=new Image(); nx.src=stills[(gi+1)%stills.length].src;
  }
  function openGallery(i=0){ gal.classList.add('open'); gal.setAttribute('aria-hidden','false'); $('galCount').textContent=stills.length+' images'; show(i); }
  function closeGallery(){ gal.classList.remove('open'); gal.setAttribute('aria-hidden','true'); }
  $('btnGallery').onclick=()=>openGallery(0);
  $('galClose').onclick=closeGallery; $('galPrev').onclick=()=>show(gi-1); $('galNext').onclick=()=>show(gi+1);
  addEventListener('keydown',e=>{ if(!gal.classList.contains('open')) return;
    if(e.key==='Escape') closeGallery(); if(e.key==='ArrowRight') show(gi+1); if(e.key==='ArrowLeft') show(gi-1); });
  let tx=null; gal.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
  gal.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) show(gi+(dx<0?1:-1)); tx=null; });
})();
</script>
</body>
</html>
